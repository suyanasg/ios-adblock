name: 每日同步去广告规则

# 一天一次：抓上游 → 过滤 → 构建 → 单测 → 提交
# 提交之后 raw.githubusercontent.com 上的 .module 就是最新的，
# 手机上「模块订阅」会自动拉到。
#
# 手动触发：Actions 页面点 Run workflow

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00，手机在充电、没人用
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "*.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓上游规则并过滤
        run: python sync.py

      - name: 构建模块
        env:
          # 仓库变量 SCRIPT_URL 优先；没配就用现存 Gist
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
          FALLBACK_URL: https://gist.githubusercontent.com/suyanasg/115df6b1947d22f7d356f594f0ce1223/raw/adclean.js
        run: |
          URL="${SCRIPT_URL:-$FALLBACK_URL}"
          echo "script-path = $URL"
          python build.py --script-url "$URL"

      - name: 单元测试
        run: |
          node test/test.js
          node test/test-splash.js

      - name: 报告规则变化
        run: |
          echo "### 本次构建" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dist/manifest.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "规则没变化，不提交"
          else
            git commit -m "chore: 每日同步 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: 更新 Gist 脚本（可选）
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "没配 GIST_TOKEN / GIST_ID，跳过。脚本走 raw 地址，不影响模块。"
            exit 0
          fi
          python deploy-gist.py --update "$GIST_ID"
