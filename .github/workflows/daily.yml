name: 每日同步去广告规则

# 一天一次：抓上游 → 过滤 → 构建 → 单测 → 提交
# 提交之后 raw.githubusercontent.com 上的 .module 就是最新的，
# 手机上「模块订阅」会自动拉到。
#
# 手动触发：Actions 页面点 Run workflow

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00，手机在充电、没人用
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "*.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          # 排队时可能已有别的 run 推过 commit；拉最新而不是触发那一刻的 SHA，
          # 否则会基于旧树提交，push 被拒（non-fast-forward）。
          ref: main
          fetch-depth: 0

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓上游规则并过滤
        run: python sync.py

      - name: 构建模块
        env:
          # 仓库变量 SCRIPT_URL 优先；没配就用现存 Gist
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
          FALLBACK_URL: https://gist.githubusercontent.com/suyanasg/115df6b1947d22f7d356f594f0ce1223/raw/adclean.js
        run: |
          URL="${SCRIPT_URL:-$FALLBACK_URL}"
          echo "script-path = $URL"
          python build.py --script-url "$URL"

      - name: 单元测试
        run: |
          node test/test.js
          node test/test-splash.js

      - name: 报告规则变化
        run: |
          echo "### 本次构建" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dist/manifest.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 提交变更
        run: |
          # 兜底：工作区残留冲突标记就直接失败。宁可这轮不提交，
          # 也不能把 <<<<<<< HEAD 这种东西推到 main 上（吃过一次亏）。
          if grep -rq '^<<<<<<< ' --include='*' . --exclude-dir=.git; then
            echo "!! 工作区有冲突标记残留，拒绝提交："
            grep -rln '^<<<<<<< ' --include='*' . --exclude-dir=.git
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "规则没变化，不提交"
            exit 0
          fi

          # dist/manifest.txt 里的 built_at 是构建时间，每次都不同。
          # 只有它变而产物没变，说明上游规则没更新，没必要留 commit。
          REAL=$(git diff --cached --name-only | grep -v '^dist/manifest\.txt$' || true)
          if [ -z "$REAL" ]; then
            echo "只有 manifest 时间戳变化，不提交"
            git reset -q HEAD
            exit 0
          fi

          git commit -m "chore: 每日同步 $(date -u +%Y-%m-%d) [skip ci]"

          # 并发兜底：万一远端在这几秒内又被推过，rebase 后再试
          for i in 1 2 3; do
            if git push; then
              echo "推送成功（第 $i 次）"
              exit 0
            fi
            echo "推送被拒，第 $i 次重试：先拉远端"
            git pull --rebase --autostash origin main || true
          done

          echo "连续 3 次推送失败"
          exit 1

      - name: 更新 Gist 脚本（可选）
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "没配 GIST_TOKEN / GIST_ID，跳过。脚本走 raw 地址，不影响模块。"
            exit 0
          fi
          python deploy-gist.py --update "$GIST_ID"
